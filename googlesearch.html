<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafSearch | Reliable Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .search-focus:focus-within { ring: 4px solid #dbeafe; border-color: #3b82f6; }
    </style>
</head>
<body>

    <div id="homeView" class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-2xl text-center">
            
            <div class="mb-8">
                <i class="fas fa-book-open text-5xl text-blue-600 mb-4"></i>
                <h1 class="text-5xl font-bold text-slate-900 tracking-tight">SafSearch</h1>
                <p class="text-slate-500 mt-2">Powered by SafMac Technology</p>
            </div>

            <div class="relative z-[9999]"> 
                <div class="search-focus flex items-center bg-white border-2 border-slate-200 rounded-2xl p-2 transition-all shadow-lg">
                    <div class="px-4 text-slate-400">
                        <i class="fas fa-search"></i>
                    </div>
                    <input type="text" id="homeSearchInput" 
                        class="w-full py-4 px-2 text-xl outline-none bg-transparent text-slate-800 relative z-[9999] pointer-events-auto" 
                        placeholder="Type your search here..." 
                        style="display: block !important; visibility: visible !important;">
                    <button id="homeSearchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-4 rounded-xl transition-transform active:scale-95">
                        Search
                    </button>
                </div>
            </div>

            <div class="mt-8 flex flex-wrap justify-center gap-2">
                <span class="text-sm font-medium text-slate-400 mr-2">Trending:</span>
                <button onclick="quickSearch('Technology')" class="text-sm text-blue-600 hover:underline">#Technology</button>
                <button onclick="quickSearch('Education')" class="text-sm text-blue-600 hover:underline">#Education</button>
                <button onclick="quickSearch('Science')" class="text-sm text-blue-600 hover:underline">#Science</button>
            </div>
        </div>
    </div>

    <div id="resultsView" class="hidden min-h-screen bg-white">
        <nav class="border-b border-slate-100 p-4 sticky top-0 bg-white z-[100]">
            <div class="max-w-7xl mx-auto flex items-center gap-4">
                <div class="cursor-pointer flex items-center gap-2" onclick="goHome()">
                    <i class="fas fa-book-open text-blue-600 text-xl"></i>
                    <span class="font-bold text-lg hidden md:block">SafSearch</span>
                </div>
                <div class="flex-1 flex items-center bg-slate-100 rounded-xl px-4 py-1 border border-transparent focus-within:border-blue-400 focus-within:bg-white transition-all">
                    <input type="text" id="navSearchInput" class="w-full p-2 bg-transparent outline-none text-slate-800">
                    <button id="navSearchBtn" class="text-blue-600 font-bold px-2">Search</button>
                </div>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto p-6">
            <div id="statusText" class="text-sm text-slate-500 mb-6 font-medium uppercase tracking-wider"></div>
            <div id="loader" class="hidden py-10 text-center">
                <i class="fas fa-circle-notch fa-spin text-3xl text-blue-600"></i>
            </div>
            <div id="resultsArea" class="space-y-8"></div>
        </main>
    </div>

    <script>
        // API CONFIG (Untouched)
        const API_KEY = 'AIzaSyDBtCFcrro8OwvLvQ-3UifBNMtUKxawyCw';
        const SEARCH_ENGINE_ID = 'b488fd849d7a04e36';

        // Elements
        const hView = document.getElementById('homeView');
        const rView = document.getElementById('resultsView');
        const hInput = document.getElementById('homeSearchInput');
        const nInput = document.getElementById('navSearchInput');
        const resultsArea = document.getElementById('resultsArea');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');

        // Force Focus Fix: This ensures the input is active when the page loads
        window.onload = () => {
            hInput.focus();
            checkUrl();
        };

        // Routing Logic
        window.onpopstate = () => checkUrl();

        function checkUrl() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q) {
                showResults(q);
            } else {
                showHome();
            }
        }

        function showHome() {
            hView.classList.remove('hidden');
            rView.classList.add('hidden');
            hInput.focus();
        }

        async function showResults(query) {
            hView.classList.add('hidden');
            rView.classList.remove('hidden');
            nInput.value = query;
            
            loader.classList.remove('hidden');
            resultsArea.innerHTML = '';
            statusText.innerText = 'Searching...';

            try {
                const res = await fetch(`https://www.googleapis.com/customsearch/v1?key=${API_KEY}&cx=${SEARCH_ENGINE_ID}&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                loader.classList.add('hidden');

                if (data.items) {
                    statusText.innerText = `Results for "${query}"`;
                    data.items.forEach(item => {
                        const card = document.createElement('div');
                        card.innerHTML = `
                            <div class="group">
                                <p class="text-xs text-slate-500 truncate">${item.displayLink}</p>
                                <a href="${item.link}" target="_blank" class="text-xl text-blue-600 font-semibold hover:underline">${item.title}</a>
                                <p class="text-slate-600 text-sm mt-1">${item.snippet}</p>
                            </div>
                        `;
                        resultsArea.appendChild(card);
                    });
                } else {
                    statusText.innerText = 'No results found.';
                }
            } catch (e) {
                loader.classList.add('hidden');
                statusText.innerText = 'Error loading results.';
            }
        }

        // Action Handlers
        function startSearch(input) {
            const val = input.value.trim();
            if (val) {
                const url = new URL(window.location);
                url.searchParams.set('q', val);
                window.history.pushState({}, '', url);
                showResults(val);
            }
        }

        function quickSearch(t) {
            hInput.value = t;
            startSearch(hInput);
        }

        function goHome() {
            window.history.pushState({}, '', window.location.pathname);
            showHome();
        }

        // Listeners
        document.getElementById('homeSearchBtn').onclick = () => startSearch(hInput);
        document.getElementById('navSearchBtn').onclick = () => startSearch(nInput);
        hInput.onkeydown = (e) => e.key === 'Enter' && startSearch(hInput);
        nInput.onkeydown = (e) => e.key === 'Enter' && startSearch(nInput);
    </script>
</body>
</html>
