<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafSearch | Modern Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-container {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-container:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            transform: translateY(-1px);
        }

        input { -webkit-appearance: none; }
        
        .result-card:hover {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }
    </style>
</head>
<body class="antialiased">

    <div id="homeView" class="min-h-screen flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-3xl text-center">
            <div class="mb-10 space-y-2">
                <div class="inline-block p-4 rounded-2xl bg-blue-600/10 mb-4">
                    <i class="fas fa-rocket text-4xl text-blue-500"></i>
                </div>
                <h1 class="text-6xl font-bold tracking-tighter bg-gradient-to-b from-white to-slate-500 bg-clip-text text-transparent">
                    SafSearch
                </h1>
                <p class="text-slate-400 font-light tracking-wide">Next-gen intelligence by <span class="text-blue-400">SafMac</span></p>
            </div>

            <div class="relative w-full max-w-2xl mx-auto">
                <div class="search-container flex items-center bg-slate-900/50 rounded-2xl p-2">
                    <div class="px-5 text-slate-500">
                        <i class="fas fa-search"></i>
                    </div>
                    <input type="text" id="homeSearchInput" 
                        class="w-full py-4 text-lg outline-none bg-transparent text-white placeholder-slate-500" 
                        placeholder="Search the web with SafSearch..."
                        autocomplete="off">
                    <button id="homeSearchBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-8 py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                        Search
                    </button>
                </div>
            </div>

            <div class="mt-10 flex flex-wrap justify-center gap-4">
                <span class="text-xs uppercase tracking-widest text-slate-500 w-full mb-2">Trending Topics</span>
                <button onclick="quickSearch('AI Trends')" class="px-4 py-1.5 rounded-full border border-slate-800 text-sm text-slate-300 hover:bg-slate-800 transition-colors">#AI</button>
                <button onclick="quickSearch('Web3')" class="px-4 py-1.5 rounded-full border border-slate-800 text-sm text-slate-300 hover:bg-slate-800 transition-colors">#Web3</button>
                <button onclick="quickSearch('SpaceX')" class="px-4 py-1.5 rounded-full border border-slate-800 text-sm text-slate-300 hover:bg-slate-800 transition-colors">#Space</button>
            </div>
        </div>
    </div>

    <div id="resultsView" class="hidden min-h-screen bg-[#020617]">
        <nav class="glass-nav sticky top-0 p-4 z-[100]">
            <div class="max-w-7xl mx-auto flex items-center gap-6">
                <div class="cursor-pointer flex items-center gap-3 group" onclick="goHome()">
                    <i class="fas fa-rocket text-blue-500 text-2xl group-hover:rotate-12 transition-transform"></i>
                    <span class="font-bold text-xl tracking-tight hidden md:block">SafSearch</span>
                </div>
                <div class="flex-1 flex items-center bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-1.5 focus-within:border-blue-500 transition-all">
                    <input type="text" id="navSearchInput" class="w-full p-2 bg-transparent outline-none text-white placeholder-slate-500" autocomplete="off">
                    <button id="navSearchBtn" class="text-blue-400 hover:text-blue-300 font-semibold px-2">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto p-8">
            <div id="statusText" class="text-xs font-bold text-slate-500 mb-8 uppercase tracking-[0.2em]"></div>
            
            <div id="loader" class="hidden py-20 text-center">
                <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            </div>

            <div id="resultsArea" class="space-y-10"></div>
        </main>
    </div>

    <script>
        const API_KEY = 'AIzaSyDBtCFcrro8OwvLvQ-3UifBNMtUKxawyCw';
        const SEARCH_ENGINE_ID = 'b488fd849d7a04e36';

        const hView = document.getElementById('homeView');
        const rView = document.getElementById('resultsView');
        const hInput = document.getElementById('homeSearchInput');
        const nInput = document.getElementById('navSearchInput');
        const resultsArea = document.getElementById('resultsArea');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');

        window.onload = () => { hInput.focus(); checkUrl(); };
        window.onpopstate = () => checkUrl();

        function checkUrl() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q) showResults(q);
            else showHome();
        }

        function showHome() {
            hView.classList.remove('hidden');
            rView.classList.add('hidden');
            hInput.focus();
        }

        async function showResults(query) {
            hView.classList.add('hidden');
            rView.classList.remove('hidden');
            nInput.value = query;
            loader.classList.remove('hidden');
            resultsArea.innerHTML = '';
            statusText.innerText = 'Analyzing web results...';

            try {
                const res = await fetch(`https://www.googleapis.com/customsearch/v1?key=${API_KEY}&cx=${SEARCH_ENGINE_ID}&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                loader.classList.add('hidden');

                if (data.items) {
                    statusText.innerText = `Results Found for "${query}"`;
                    data.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = "result-card p-4 transition-all border-l-2 border-transparent hover:border-blue-600";
                        card.innerHTML = `
                            <div class="group">
                                <p class="text-xs text-blue-400/60 mb-1 flex items-center gap-2">
                                    <i class="fas fa-link text-[10px]"></i> ${item.displayLink}
                                </p>
                                <a href="${item.link}" target="_blank" class="text-xl text-blue-400 font-semibold group-hover:text-blue-300 transition-colors">
                                    ${item.title}
                                </a>
                                <p class="text-slate-400 text-sm mt-2 leading-relaxed font-light">${item.snippet}</p>
                            </div>
                        `;
                        resultsArea.appendChild(card);
                    });
                } else {
                    statusText.innerText = 'No signals found for this search.';
                }
            } catch (e) {
                loader.classList.add('hidden');
                statusText.innerText = 'Network error. Please try again.';
            }
        }

        function startSearch(inputElement) {
            const val = inputElement.value.trim();
            if (val) {
                const url = new URL(window.location);
                url.searchParams.set('q', val);
                window.history.pushState({}, '', url);
                showResults(val);
            }
        }

        function quickSearch(t) {
            hInput.value = t;
            startSearch(hInput);
        }

        function goHome() {
            window.history.pushState({}, '', window.location.pathname);
            showHome();
        }

        document.getElementById('homeSearchBtn').onclick = () => startSearch(hInput);
        document.getElementById('navSearchBtn').onclick = () => startSearch(nInput);
        hInput.onkeydown = (e) => { if (e.key === 'Enter') startSearch(hInput); };
        nInput.onkeydown = (e) => { if (e.key === 'Enter') startSearch(nInput); };
    </script>
</body>
</html>
